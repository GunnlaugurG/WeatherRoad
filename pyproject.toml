[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherroad"
version = "1.0.0"
description = "Iceland Weather Route Planner - Plan safe driving routes around Iceland based on real-time weather and road conditions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GunnlaugurG"}
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "flask>=3.0.0",
]

[project.scripts]
weatherroad = "weatherroad.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "responses>=0.24.0",
]
